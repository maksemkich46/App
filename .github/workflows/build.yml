name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q OsmNav.zip
      - run: sed -i "s/__MAPTILER_KEY__/$KEY/" OsmNav/app/src/main/java/com/example/osmnav/MainActivity.kt
        env:
          KEY: ${{ secrets.MAPTILER_KEY }}
      - run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> OsmNav/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx3g" >> OsmNav/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        working-directory: OsmNav
        run: |
          gradle assembleDebug --no-daemon --console=plain > ../build.log 2>&1 || {
            grep -E "^e: " ../build.log | sed -e 's#file:///[^ ]*/osmnav/##' | head -12 | while read -r l; do echo "::error::$l"; done
            tail -30 ../build.log
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: OsmNav-apk
          path: OsmNav/app/build/outputs/apk/debug/app-debug.apk
